<!doctype html><html><head><meta charset="utf-8"><title>house3d test</title>
<style>body{margin:0;background:#05070b}#wslog{position:fixed;left:8px;bottom:64px;z-index:9;max-width:460px;max-height:160px;overflow:auto;margin:0;padding:6px 9px;border-radius:8px;background:rgba(0,0,0,.7);color:#9fe3c8;font:11px/1.45 ui-monospace,Consolas,monospace;pointer-events:none}#wslog:empty{display:none}</style></head><body>
<pre id="wslog"></pre>
<house3d-card id="c"></house3d-card>
<script type="module">
import './house3d-card.js';
// ---- mock Home Assistant ------------------------------------------------------------------------------
const areas = Object.fromEntries(['living_room:Living Room', 'kitchen:Kitchen', 'family_room:Family Room', 'master_bedroom:Master Bedroom', 'garage:Garage', 'office:Office', 'laundry:Laundry', 'shed:Shed']
  .map((s) => s.split(':')).map(([id, name]) => [id, { area_id: id, name }]));
const S = (eid, state, attributes = {}) => [eid, { entity_id: eid, state, attributes: { friendly_name: eid.split('.')[1].replace(/_/g, ' '), ...attributes }, last_changed: new Date().toISOString() }];
let states = Object.fromEntries([
  // placed through HA areas
  S('light.living_lamp', 'on', { brightness: 200 }), S('light.living_ceiling', 'off'), S('media_player.living_tv', 'playing', { media_title: 'Dune' }),
  S('light.kitchen', 'on', { brightness: 255, rgb_color: [255, 220, 180] }), S('sensor.kitchen_temp', '21.4', { device_class: 'temperature', unit_of_measurement: '°C' }),
  S('light.family', 'on', { rgb_color: [120, 140, 255], brightness: 150 }), S('climate.thermostat', 'heat', { current_temperature: 20.5, temperature: 21, hvac_action: 'heating' }),
  S('light.master', 'off'), S('fan.master_fan', 'on'), S('binary_sensor.garage_door', 'on', { device_class: 'garage_door' }), S('switch.garage_heater', 'off'),
  S('binary_sensor.office_motion', 'on', { device_class: 'motion' }), S('light.office', 'unavailable'),
  S('switch.washer_plug', 'on'),                                   // area via its device (laundry)
  S('cover.garage_door', 'open', { device_class: 'garage' }), S('lock.garage_entry', 'unlocked'),
  S('sensor.living_humidity', '47', { device_class: 'humidity', unit_of_measurement: '%' }), S('sensor.family_temp', '22.8', { device_class: 'temperature', unit_of_measurement: '°C' }),
  S('binary_sensor.kitchen_leak', 'on', { device_class: 'moisture' }), S('media_player.family_sonos', 'paused', { media_title: 'Podcast' }),
  S('binary_sensor.master_window', 'off', { device_class: 'window' }),
  // placed through card overrides
  S('light.deck_string', 'on', { brightness: 120 }),               // entities: room deck + x/z
  S('vacuum.roomba', 'docked'),                                    // entities: floor-only (no room)
  // unassigned (no area / unmapped area / explicit room '')
  S('light.wiz_09d07a', 'off'), S('light.wiz_e555b7', 'on', { brightness: 60 }), S('media_player.googletv6405', 'idle'),
  S('switch.shed_pump', 'off'),                                    // area "Shed" has no room on the plan
  S('lock.side_door', 'locked'),                                   // explicit room: '' in card config
  S('light.wiz_f3a48b', 'on', { brightness: 255, rgb_color: [255, 120, 60] }), S('light.wiz_adff73', 'unavailable'),
  S('media_player.viziocastdisplay4519', 'off'), S('fan.bathroom_exhaust', 'on'), S('climate.upstairs', 'cool', { current_temperature: 24, temperature: 22.5, hvac_action: 'cooling' }),
  // hidden (exclude list and entities:false)
  S('switch.socket_1', 'unavailable'), S('switch.emergency_heat', 'off'), S('media_player.old_cast', 'unavailable'),
]);
const AREA = { living: 'living_room', kitchen: 'kitchen', family: 'family_room', thermo: 'family_room', master: 'master_bedroom', garage: 'garage', office: 'office', shed: 'shed' };
const entities = {};
for (const eid of Object.keys(states)) {
  const k = Object.keys(AREA).find((x) => eid.includes(x));
  entities[eid] = { entity_id: eid, area_id: k ? AREA[k] : null, device_id: eid === 'switch.washer_plug' ? 'dev_washer' : null };
}
delete entities['light.wiz_09d07a']; // YAML-only entity: not in the registry, area sync must skip it
const devices = { dev_washer: { id: 'dev_washer', area_id: 'laundry' } };

let lovelace = { views: [{ title: 'House 3D', type: 'panel', cards: [{
  type: 'custom:house3d-card', title: 'Home', height: '100vh',
  rooms: { lower_room: 'office' },
  entities: { 'light.deck_string': { room: 'deck', x: 30.5, z: 3.2 }, 'vacuum.roomba': { floor: 'main', x: 20, z: 14 }, 'lock.side_door': { room: '' }, 'media_player.old_cast': false },
  exclude: ['switch.socket_1', 'switch.emergency_heat'],
}] }] };
const cardCfg = () => JSON.parse(JSON.stringify(lovelace.views[0].cards[0]));

const wsLog = (window.wsLog = []), areaLog = (window.areaLog = []);
const logEl = document.getElementById('wslog');
function log(msg) { areaLog.push(msg); console.log('[mock HA]', msg); logEl.textContent = areaLog.slice(-8).join('\n'); }
const hass = {
  user: { is_admin: true }, language: 'en', areas, devices,
  get states() { return states; }, get entities() { return entities; },
  callWS: async (m) => {
    wsLog.push(JSON.parse(JSON.stringify(m)));
    console.log('callWS', JSON.stringify(m).slice(0, 300));
    await new Promise((r) => setTimeout(r, 60));
    switch (m.type) {
      case 'lovelace/config': return JSON.parse(JSON.stringify(lovelace));
      case 'lovelace/config/save': log(`lovelace/config/save (${Object.keys(m.config.views[0].cards[0].entities || {}).length} entity overrides, ${(m.config.views[0].cards[0].exclude || []).length} excluded)`); lovelace = JSON.parse(JSON.stringify(m.config)); setTimeout(() => c.setConfig(cardCfg()), 0); return null; // HA re-renders the card
      case 'config/entity_registry/update': {
        if (!entities[m.entity_id]) { log(`registry update FAILED ${m.entity_id}: not in registry`); throw { code: 'not_found', message: 'Entity not found' }; }
        if (m.area_id && !areas[m.area_id]) { log(`registry update FAILED ${m.entity_id}: unknown area ${m.area_id}`); throw { code: 'invalid_format', message: 'Area not found' }; }
        const was = entities[m.entity_id].area_id;
        entities[m.entity_id] = { ...entities[m.entity_id], area_id: m.area_id };
        log(`entity_registry/update ${m.entity_id}: area ${was ?? 'null'} → ${m.area_id ?? 'null'}`);
        push({ entities: { ...entities } });
        return { entity_entry: entities[m.entity_id] };
      }
      default: throw { code: 'unknown_command', message: m.type };
    }
  },
  callService: async (d, s, data) => { const e = data.entity_id, st = states[e]; states = { ...states, [e]: { ...st, state: st.state === 'on' ? 'off' : 'on' } }; push(); },
};
let cur = { ...hass };
// HA hands the card a new hass object on every change; entity registry changes replace hass.entities
function push(over = {}) { cur = { ...cur, states, ...over }; c.hass = cur; }
const c = document.getElementById('c');
c.setConfig(cardCfg());
push({ entities: { ...entities } });
// live state churn so the drawer's state column can be watched updating
setInterval(() => { const b = Math.round(Math.random() * 255); states = { ...states, 'light.living_lamp': { ...states['light.living_lamp'], attributes: { ...states['light.living_lamp'].attributes, brightness: b } } }; push(); }, 2000);
Object.assign(window, { c, hass, getLovelace: () => lovelace, getEntities: () => entities, push });
</script></body></html>
